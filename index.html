<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جحيم المزعج</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:Arial;padding:20px}
h1{color:red;font-size:34px}
button{background:red;color:#fff;border:0;padding:18px;font-size:22px;border-radius:12px;width:100%;margin-top:20px}
.box{border:1px solid red;padding:15px;border-radius:15px;margin:15px 0;background:#111}
input{width:90%;padding:14px;font-size:20px;text-align:center;border-radius:10px}
#game{display:none}
</style>
</head>
<body>

<div id="home">
<h1>💀 جحيم المزعج 💀</h1>
<p>الساعة 3 الفجر.. الكل نايم.. الا انت</p>
<div class="box">⚠️ العب على مسؤوليتك - فيها خضات</div>
<div class="box" id="prog">خلصت 0 من 4 ملفات</div>
<button id="startBtn">🔥 ابدأ اللعب - ادخل الجحيم</button>
<p>دوس على الزرار الاحمر ده</p>
</div>

<div id="game">
<h1 id="title">الملف 1 / 4</h1>
<div class="box"><p id="q" style="font-size:22px"></p>
<input id="ans" placeholder="اكتب اجابتك">
<button id="checkBtn">افتح الملف</button>
<p id="msg"></p>
</div>
</div>

<script>
var level = 0;
var done = 0;
var qs = [
  ["الملف 1: انا بمشي من غير رجلين وبخوفك وانت نايم.. انا ايه؟ اكتب: شبح", "شبح"],
  ["الملف 2: الساعة كام اللي الكل بيخاف يصحى فيها؟ اكتب الرقم: 3", "3"],
  ["الملف 3: ايه اللي بيولع ومبيتحرقش؟ اكتب: نار", "نار"],
  ["الملف 4: اكتب كلمة السر عشان تهرب: المزعج", "المزعج"]
];

document.getElementById("startBtn").addEventListener("click", function(){
  document.getElementById("home").style.display = "none";
  document.getElementById("game").style.display = "block";
  showQ();
});

function showQ(){
  document.getElementById("title").innerText = "الملف " + (level+1) + " / 4";
  document.getElementById("q").innerText = qs[level][0];
  document.getElementById("ans").value = "";
  document.getElementById("msg").innerText = "";
}

document.getElementById("checkBtn").addEventListener("click", function(){
  var v = document.getElementById("ans").value.trim();
  if(v === qs[level][1]){
    done++;
    document.getElementById("prog").innerText = "خلصت " + done + " من 4 ملفات";
    alert("صح! فتحت الملف " + (level+1));
    level++;
    if(level >= 4){
      alert("عاش! هربت من الجحيم وخدت لقب الناجي 👑");
      location.reload();
    } else {
      showQ();
    }
  } else {
    document.getElementById("msg").innerText = "غلط! حاول تاني";
  }
});
</script>
</body>
</html>
