
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050000">
<meta name="mobile-web-app-capable" content="yes">
<title>HELL OF ALMOZAG X</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:#000;color:white;font-family:Arial;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#vignette,#blood{position:fixed;inset:0;pointer-events:none;z-index:4}
#vignette{background:radial-gradient(ellipse,transparent 30%,#000d 100%)}
#blood{opacity:0;background:radial-gradient(ellipse,transparent 30%,#b0000080 100%);transition:.3s}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:8;pointer-events:none;gap:8px}
.panel{background:#000b;border:1px solid #6d2020;border-radius:10px;padding:8px 11px;min-width:125px;font-size:12px}
.bar{height:8px;background:#292929;border-radius:20px;overflow:hidden;margin-top:4px}
.fill{height:100%;width:100%;transition:width .2s}
#hpFill{background:#e00000}
#stFill{background:#ffbf00}
#batFill{background:#00d9ff}
#cross{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:23px;z-index:5;pointer-events:none;text-shadow:0 0 8px red}
#objective{position:fixed;bottom:125px;left:10px;background:#000c;padding:9px 12px;border-right:3px solid red;border-radius:7px;z-index:8;font-size:12px}
#keys{position:fixed;top:92px;right:10px;background:#000b;padding:8px;border-radius:8px;z-index:8}
#message{position:fixed;z-index:30;top:50%;left:50%;transform:translate(-50%,-50%);background:#090000f2;border:1px solid red;border-radius:12px;padding:18px;width:85%;max-width:350px;text-align:center;display:none;line-height:1.8}
#joy{position:fixed;bottom:15px;left:15px;width:105px;height:105px;border-radius:50%;border:2px solid #ffffff55;background:#ffffff18;z-index:12;touch-action:none}
#knob{position:absolute;width:44px;height:44px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#ffffffbb}
#buttons{position:fixed;bottom:15px;right:12px;display:flex;gap:7px;z-index:12}
.btn{width:53px;height:53px;border-radius:50%;border:2px solid #ffffff66;background:#000b;color:white;font-size:20px;display:grid;place-items:center;touch-action:none}
.btn:active,.btn.active{background:#a00000}
#btnFlash{border-color:#00cfff}
#btnRun{border-color:#ffcc00}
#menu,#endScreen{position:fixed;inset:0;z-index:40;background:linear-gradient(#0008,#000e),url("https://images.unsplash.com/photo-1509557965875-b88c97052f0e?w=1400") center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
h1{font-size:clamp(30px,7vw,55px);color:red;text-shadow:0 0 18px red;line-height:1.15}
.subtitle{color:#ddd;margin:15px 0;line-height:1.8;font-size:14px}
.mainBtn{border:0;background:#c00000;color:white;padding:14px 35px;border-radius:30px;font-weight:bold;font-size:19px;box-shadow:0 0 20px #f00000;cursor:pointer;margin:5px}
#endScreen{display:none;background:#050000ed}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:black;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:22px;gap:20px}
#rotate span{font-size:65px}
@media(orientation:portrait) and (max-width:900px){
#rotate{display:flex}
}
@media(orientation:landscape){
.panel{padding:5px 9px}
#joy{width:90px;height:90px}
#knob{width:40px;height:40px}
.btn{width:48px;height:48px}
}
</style>
</head>

<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="blood"></div>

<div id="rotate">
<span>📱↻</span>
اقلب الموبايل بالعرض
<small>HELL OF ALMOZAG X</small>
</div>

<div id="hud">
 <div class="panel">
  🔦 BATTERY <span id="batText">100%</span>
  <div class="bar"><div class="fill" id="batFill"></div></div>
  ⏱️ <span id="timer">00:00</span>
  <div id="location">WEST WING</div>
 </div>
 <div class="panel" dir="ltr">
  ❤️ HP <span id="hpText">100</span>
  <div class="bar"><div class="fill" id="hpFill"></div></div>
  🏃 STAMINA <span id="stText">100%</span>
  <div class="bar"><div class="fill" id="stFill"></div></div>
 </div>
</div>

<div id="cross">+</div>
<div id="keys">🔑 <span id="keyText">0</span>/3</div>
<div id="objective">🎯 اجمع المفاتيح الثلاثة</div>
<div id="message"></div>

<div id="joy"><div id="knob"></div></div>

<div id="buttons">
 <button class="btn" id="btnFlash">🔦</button>
 <button class="btn" id="btnRun">🏃</button>
 <button class="btn" id="btnJump">⬆️</button>
 <button class="btn" id="btnAct">✋</button>
</div>

<div id="menu">
 <div style="font-size:55px">💀</div>
 <h1>HELL OF<br>ALMOZAG X</h1>
 <div class="subtitle">
  هل تستطيع الهروب من القصر؟<br>
  اجمع 3 مفاتيح وافتح باب النجاة.<br>
  احذر... الوحش يراقبك!
 </div>
 <button class="mainBtn" id="start">▶ ابدأ اللعب</button>
 <button class="mainBtn" id="instructions" style="background:#292929">📖 التعليمات</button>
 <small style="color:#aaa;margin-top:12px">3D HORROR EXPERIENCE</small>
</div>

<div id="endScreen">
 <h1 id="endTitle">GAME OVER</h1>
 <p class="subtitle" id="endText"></p>
 <button class="mainBtn" id="restart">🔄 العب من جديد</button>
 <button class="mainBtn" id="home" style="background:#292929">القائمة الرئيسية</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
"use strict";

/* ===== GAME DATA ===== */

let scene,camera,renderer,monster,flash,clock;
let gameStarted=false,gameOver=false;
let flashOn=true,running=false;
let time=0,lastHit=0,jumpTime=0;
let yaw=0,pitch=0;
let joystick={x:0,y:0,active:false};
let keyboard={x:0,z:0};
let lastTouch=null;
let keys=[];
let walls=[];
let player={
 x:0,z:8,y:1.7,
 hp:100,st:100,bat:100,
 count:0,speed:3
};
let best=Number(localStorage.getItem("almo_best")||0);
let soundContext=null;

const $=id=>document.getElementById(id);

function message(txt,ms=2200){
 $("message").innerHTML=txt;
 $("message").style.display="block";
 clearTimeout(message.timer);
 message.timer=setTimeout(()=>{$("message").style.display="none"},ms);
}

function sound(freq=100,duration=.2,type="sine",volume=.07){
 try{
  if(!soundContext)soundContext=new(window.AudioContext||window.webkitAudioContext)();
  if(soundContext.state==="suspended")soundContext.resume();
  let o=soundContext.createOscillator();
  let g=soundContext.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,soundContext.currentTime);
  g.gain.setValueAtTime(volume,soundContext.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,soundContext.currentTime+duration);
  o.connect(g);g.connect(soundContext.destination);
  o.start();o.stop(soundContext.currentTime+duration);
 }catch(e){}
}

/* ===== LANDSCAPE ===== */

async function landscape(){
 try{
  if(screen.orientation?.lock)
   await screen.orientation.lock("landscape");
 }catch(e){}
}

/* ===== WORLD ===== */

function material(color,extra={}){
 return new THREE.MeshStandardMaterial({color,roughness:.85,...extra});
}

function wall(w,h,d,x,y,z,color=0x292323){
 let m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),
  material(color)
 );
 m.position.set(x,y,z);
 scene.add(m);
 walls.push({x,z,w,d});
 return m;
}

function pointLight(color,intensity,distance,x,y,z){
 let l=new THREE.PointLight(color,intensity,distance);
 l.position.set(x,y,z);
 scene.add(l);
 return l;
}

function createWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x030303);
 scene.fog=new THREE.Fog(0x030303,4,24);

 camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);

 renderer=new THREE.WebGLRenderer({
  canvas:$("game"),
  antialias:true
 });
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;

 scene.add(new THREE.AmbientLight(0x333344,.65));

 let floor=new THREE.Mesh(
  new THREE.PlaneGeometry(30,30),
  material(0x30251e)
 );
 floor.rotation.x=-Math.PI/2;
 floor.position.y=-.11;
 scene.add(floor);

 // Main mansion walls
 wall(20,3.5,.4,0,1.75,-10);
 wall(20,3.5,.4,0,1.75,10);
 wall(.4,3.5,20,-10,1.75,0);
 wall(.4,3.5,20,10,1.75,0);

 // Internal walls with openings
 wall(.3,3.5,7,-4,1.75,-6.5);
 wall(.3,3.5,6,-4,1.75,7);
 wall(.3,3.5,6,4,1.75,-7);
 wall(.3,3.5,7,4,1.75,6.5);
 wall(6,3.5,.3,-7,1.75,-2);
 wall(6,3.5,.3,7,1.75,-2);
 wall(5,3.5,.3,-7,1.75,4);
 wall(5,3.5,.3,7,1.75,4);

 // Carpet
 let carpet=new THREE.Mesh(
  new THREE.PlaneGeometry(2,15),
  material(0x570707)
 );
 carpet.rotation.x=-Math.PI/2;
 carpet.position.set(0,.01,0);
 scene.add(carpet);

 // Furniture
 function furniture(x,z,w,d,h,color){
  let m=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   material(color)
  );
  m.position.set(x,h/2,z);
  scene.add(m);
 }
 furniture(-7,0,2,3,.7,0x49301f);
 furniture(7,0,2,2,.8,0x604322);
 furniture(-7,-7,2,1,2.3,0x382317);
 furniture(7,7,2,1,2,0x382317);

 // Exit door
 let door=new THREE.Mesh(
  new THREE.BoxGeometry(2,2.8,.25),
  material(0x7d0808,{emissive:0x270000})
 );
 door.position.set(0,1.4,-9.65);
 scene.add(door);

 // Lights
 for(let z=-8;z<=8;z+=4){
  pointLight(0xff5500,.8,5,-3.5,2.5,z);
  pointLight(0xff5500,.8,5,3.5,2.5,z);
 }

 // Keys
 createKey(-7,1);
 createKey(7,1);
 createKey(0,-6);

 // Monster
 monster=new THREE.Group();

 let black=material(0x080808);
 let body=new THREE.Mesh(
  new THREE.CylinderGeometry(.38,.55,1.7,9),
  black
 );
 body.position.y=1.15;
 monster.add(body);

 let head=new THREE.Mesh(
  new THREE.SphereGeometry(.34,12,12),
  black
 );
 head.position.y=2.2;
 monster.add(head);

 let eyeMat=new THREE.MeshBasicMaterial({color:0xff0000});
 for(let x of [-.13,.13]){
  let eye=new THREE.Mesh(
   new THREE.SphereGeometry(.055,8,8),
   eyeMat
  );
  eye.position.set(x,2.25,.29);
  monster.add(eye);
 }

 monster.position.set(0,0,-7);
 scene.add(monster);

 flash=new THREE.SpotLight(0xffffff,2,22,.48,.45,1);
 scene.add(flash);
 scene.add(flash.target);

 camera.position.set(player.x,player.y,player.z);
}

function createKey(x,z){
 let g=new THREE.Group();

 let gold=material(0xffc400,{
  emissive:0x885500,
  emissiveIntensity:.8,
  metalness:.7
 });

 let ring=new THREE.Mesh(
  new THREE.TorusGeometry(.18,.045,8,20),
  gold
 );

 let stem=new THREE.Mesh(
  new THREE.BoxGeometry(.07,.45,.07),
  gold
 );
 stem.position.y=-.32;

 g.add(ring,stem);
 g.position.set(x,1,z);
 scene.add(g);

 let light=new THREE.PointLight(0xffcc00,.8,3);
 g.add(light);

 keys.push({group:g,x,z,taken:false});
}

/* ===== COLLISION ===== */

function blocked(x,z){
 const radius=.35;
 if(x<-9.3||x>9.3||z<-9.3||z>9.3)return true;

 for(const w of walls){
  if(
   x+radius>w.x-w.w/2 &&
   x-radius<w.x+w.w/2 &&
   z+radius>w.z-w.d/2 &&
   z-radius<w.z+w.d/2
  )return true;
 }
 return false;
}

function movePlayer(dx,dz){
 if(!blocked(player.x+dx,player.z))player.x+=dx;
 if(!blocked(player.x,player.z+dz))player.z+=dz;
}

/* ===== PLAYER ===== */

function updatePlayer(dt){
 let speed=player.speed;

 if(running&&player.st>0){
  speed*=1.75;
  player.st=Math.max(0,player.st-dt*18);
 }else{
  player.st=Math.min(100,player.st+dt*9);
 }

 let fx=keyboard.x+joystick.x;
 let fz=keyboard.z+joystick.y;
 let len=Math.hypot(fx,fz);

 if(len>1){fx/=len;fz/=len;}

 let dx=(-Math.sin(yaw)*fz+Math.cos(yaw)*fx)*speed*dt;
 let dz=(-Math.cos(yaw)*fz-Math.sin(yaw)*fx)*speed*dt;

 movePlayer(dx,dz);

 if(jumpTime>0){
  jumpTime-=dt;
  player.y=1.7+Math.sin((1-jumpTime/.45)*Math.PI)*.75;
 }else player.y=1.7;

 camera.position.set(
  player.x,
  player.y+Math.sin(time*9)*.018,
  player.z
 );

 camera.rotation.order="YXZ";
 camera.rotation.y=yaw;
 camera.rotation.x=pitch;

 flash.position.copy(camera.position);
 flash.target.position.set(
  player.x-Math.sin(yaw)*5,
  player.y+Math.sin(pitch)*5,
  player.z-Math.cos(yaw)*5
 );

 flash.visible=flashOn;

 if(flashOn){
  player.bat=Math.max(0,player.bat-dt*.75);
  if(player.bat===0)flashOn=false;
 }
}

/* ===== KEYS ===== */

function updateKeys(dt){
 keys.forEach(k=>{
  if(k.taken)return;

  k.group.rotation.y+=dt*2;
  k.group.position.y=1+Math.sin(time*2+k.x)*.15;

  if(Math.hypot(player.x-k.x,player.z-k.z)<1.15){
   k.taken=true;
   k.group.visible=false;
   player.count++;

   $("keyText").textContent=player.count;

   sound(750,.2,"sine",.1);

   if(player.count===3){
    $("objective").textContent="🚪 اذهب إلى باب الخروج!";
    message("🔑 جمعت كل المفاتيح! اهرب إلى الباب!");
   }else{
    message("🔑 حصلت على مفتاح! باقي "+(3-player.count));
   }
  }
 });
}

/* ===== MONSTER AI ===== */

function updateMonster(dt){
 let dx=player.x-monster.position.x;
 let dz=player.z-monster.position.z;
 let distance=Math.hypot(dx,dz);

 let speed=1.05+player.count*.22;

 if(distance>1.1){
  let mx=dx/distance*speed*dt;
  let mz=dz/distance*speed*dt;

  // Avoid getting stuck inside walls
  if(!blocked(monster.position.x+mx,monster.position.z))
   monster.position.x+=mx;

  if(!blocked(monster.position.x,monster.position.z+mz))
   monster.position.z+=mz;

  monster.lookAt(player.x,1.3,player.z);
 }

 monster.position.y=Math.sin(time*5)*.035;

 if(distance<1.45&&time-lastHit>2){
  lastHit=time;
  player.hp=Math.max(0,player.hp-15);

  $("blood").style.opacity=1;
  setTimeout(()=>$("blood").style.opacity=0,500);

  sound(65,.5,"sawtooth",.15);
  message("💀 الوحش اقترب منك! اهرب!");

  if(player.hp<=0)finish(false);
 }
}

/* ===== INTERACTION ===== */

function interact(){
 if(gameOver||!gameStarted)return;

 let d=Math.hypot(player.x,player.z+9.5);

 if(d<2.3){
  if(player.count===3){
   finish(true);
  }else{
   message("🔒 الباب مقفول! تحتاج "+(3-player.count)+" مفاتيح");
  }
  return;
 }

 let near=keys.find(k=>!k.taken&&Math.hypot(player.x-k.x,player.z-k.z)<2);

 if(near)message("اقترب من المفتاح لجمعه");
 else message("لا يوجد شيء للتفاعل هنا");
}

function finish(win){
 if(gameOver)return;
 gameOver=true;
 gameStarted=false;
 running=false;

 if(win){
  $("endTitle").textContent="YOU ESCAPED!";
  $("endText").innerHTML="🏆 نجحت في الهروب من القصر!<br>الوقت: "+formatTime(time);
  if(best===0||time<best){
   best=time;
   localStorage.setItem("almo_best",best);
  }
  sound(650,.5);
 }else{
  $("endTitle").textContent="GAME OVER";
  $("endText").innerHTML="💀 الوحش أمسك بك!<br>حاول مرة أخرى.";
  sound(55,.8,"sawtooth");
 }

 $("endScreen").style.display="flex";
}

function formatTime(t){
 let m=Math.floor(t/60);
 let s=Math.floor(t%60);
 return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

/* ===== HUD ===== */

function updateHUD(){
 $("hpText").textContent=player.hp;
 $("hpFill").style.width=player.hp+"%";

 $("stText").textContent=Math.floor(player.st)+"%";
 $("stFill").style.width=player.st+"%";

 $("batText").textContent=Math.floor(player.bat)+"%";
 $("batFill").style.width=player.bat+"%";

 $("timer").textContent=formatTime(time);

 $("location").textContent=
  player.x<-4?"BEDROOM":
  player.x>4?"KITCHEN":
  player.z<-4?"NORTH WING":"WEST WING";
}

/* ===== MAIN LOOP ===== */

function animate(){
 requestAnimationFrame(animate);
 if(!gameStarted||gameOver)return;

 let dt=Math.min(clock.getDelta(),.05);
 time+=dt;

 updatePlayer(dt);
 updateKeys(dt);
 updateMonster(dt);
 updateHUD();

 renderer.render(scene,camera);
}

/* ===== CONTROLS ===== */

document.addEventListener("keydown",e=>{
 if(!gameStarted)return;

 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))
  e.preventDefault();

 if(e.key.toLowerCase()==="w"||e.key==="ArrowUp")keyboard.z=-1;
 if(e.key.toLowerCase()==="s"||e.key==="ArrowDown")keyboard.z=1;
 if(e.key.toLowerCase()==="a"||e.key==="ArrowLeft")keyboard.x=-1;
 if(e.key.toLowerCase()==="d"||e.key==="ArrowRight")keyboard.x=1;

 if(e.key==="Shift")running=true;
 if(e.key.toLowerCase()==="f")toggleFlash();
 if(e.key.toLowerCase()==="e")interact();
 if(e.key===" "&&jumpTime<=0)jumpTime=.45;
});

document.addEventListener("keyup",e=>{
 if(e.key.toLowerCase()==="w"||e.key==="ArrowUp")keyboard.z=0;
 if(e.key.toLowerCase()==="s"||e.key==="ArrowDown")keyboard.z=0;
 if(e.key.toLowerCase()==="a"||e.key==="ArrowLeft")keyboard.x=0;
 if(e.key.toLowerCase()==="d"||e.key==="ArrowRight")keyboard.x=0;
 if(e.key==="Shift")running=false;
});

function toggleFlash(){
 if(player.bat<=0){
  message("🔋 البطارية فارغة!");
  return;
 }
 flashOn=!flashOn;
 $("btnFlash").classList.toggle("active",flashOn);
 sound(300,.08);
}

$("joy").addEventListener("pointerdown",e=>{
 joystick.active=true;
 $("joy").setPointerCapture(e.pointerId);
});

$("joy").addEventListener("pointermove",e=>{
 if(!joystick.active)return;

 let r=$("joy").getBoundingClientRect();
 let dx=(e.clientX-r.left-r.width/2)/38;
 let dy=(e.clientY-r.top-r.height/2)/38;

 joystick.x=Math.max(-1,Math.min(1,dx));
 joystick.y=Math.max(-1,Math.min(1,dy));

 $("knob").style.transform=
  `translate(calc(-50% + ${joystick.x*25}px),calc(-50% + ${joystick.y*25}px))`;
});

function resetJoy(){
 joystick.x=0;
 joystick.y=0;
 joystick.active=false;
 $("knob").style.transform="translate(-50%,-50%)";
}
$("joy").addEventListener("pointerup",resetJoy);
$("joy").addEventListener("pointercancel",resetJoy);

document.addEventListener("pointerdown",e=>{
 if(!gameStarted)return;
 if(e.target.closest("#joy")||e.target.closest("#buttons"))return;
 if(e.pointerType==="mouse")return;
 lastTouch={x:e.clientX,y:e.clientY,id:e.pointerId};
});

document.addEventListener("pointermove",e=>{
 if(!lastTouch||lastTouch.id!==e.pointerId)return;
 yaw-=(e.clientX-lastTouch.x)*.005;
 pitch-=(e.clientY-lastTouch.y)*.005;
 pitch=Math.max(-1.1,Math.min(1.1,pitch));
 lastTouch={x:e.clientX,y:e.clientY,id:e.pointerId};
});

document.addEventListener("pointerup",()=>lastTouch=null);
document.addEventListener("pointercancel",()=>lastTouch=null);

$("btnFlash").onclick=toggleFlash;

$("btnRun").addEventListener("pointerdown",()=>{
 running=true;
 $("btnRun").classList.add("active");
});
$("btnRun").addEventListener("pointerup",()=>{
 running=false;
 $("btnRun").classList.remove("active");
});
$("btnRun").addEventListener("pointercancel",()=>{
 running=false;
 $("btnRun").classList.remove("active");
});

$("btnJump").onclick=()=>{
 if(jumpTime<=0)jumpTime=.45;
};

$("btnAct").onclick=interact;

/* Mouse look for PC */
document.addEventListener("mousemove",e=>{
 if(!gameStarted||!document.pointerLockElement)return;
 yaw-=e.movementX*.0025;
 pitch-=e.movementY*.0025;
 pitch=Math.max(-1.1,Math.min(1.1,pitch));
});

$("game").addEventListener("click",()=>{
 if(gameStarted&&matchMedia("(pointer:fine)").matches){
  $("game").requestPointerLock?.();
 }
});

/* ===== MENU ===== */

function resetGame(){
 player={
  x:0,z:8,y:1.7,
  hp:100,st:100,bat:100,
  count:0,speed:3
 };

 keys=[];
 walls=[];
 time=0;
 lastHit=0;
 yaw=0;
 pitch=0;
 jumpTime=0;
 flashOn=true;
 running=false;
 gameOver=false;

 $("keyText").textContent="0";
 $("objective").textContent="🎯 اجمع المفاتيح الثلاثة";
 $("blood").style.opacity=0;
 $("endScreen").style.display="none";
}

async function startGame(){
 await landscape();

 if(!window.THREE){
  message("تعذر تحميل محرك اللعبة. تأكد من الإنترنت.");
  return;
 }

 $("menu").style.display="none";
 resetGame();
 createWorld();

 clock=new THREE.Clock();
 gameStarted=true;

 sound(55,.7,"sine");
 message("👻 مرحباً بك... اجمع المفاتيح واهرب!",3500);

 animate();
}

$("start").onclick=startGame;

$("instructions").onclick=()=>{
 message("🎮 التحكم:<br>الجويستيك للحركة<br>اسحب الشاشة للنظر<br>🏃 للجري<br>⬆️ للقفز<br>🔦 للكشاف<br>✋ للتفاعل<br>اجمع 3 مفاتيح وافتح باب الخروج",6000);
};

$("restart").onclick=startGame;

$("home").onclick=()=>{
 $("endScreen").style.display="none";
 $("menu").style.display="flex";
};

window.addEventListener("resize",()=>{
 if(!renderer||!camera)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
 });
}
</script>
</body>
</html>
